name: CI

# Compile and test the .NET 8 code projects.
# Runs automatically on every push to main and on every pull request.
# The Visual Studio deployment project (installer/installer.vdproj) and the
# release artifacts are intentionally NOT built here — see release.yaml.

on:
    push:
        branches: ["main"]
    pull_request:

permissions:
    contents: read

jobs:
    build-and-test:
        name: Compile & Test
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v6

            - name: Setup .NET 8
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: "8.0.x"

            # Restoring/building the Testing project pulls in its dependencies
            # (DTC and the DTCCodeGenerator analyzer), so this compiles every
            # code project in the solution in one shot.
            - name: Restore
              run: dotnet restore Testing/Testing.csproj

            - name: Compile (Release)
              run: dotnet build Testing/Testing.csproj -c Release --no-restore

            - name: Test
              run: dotnet test Testing/Testing.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx"

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: test-results
                  path: "**/test-results.trx"
                  if-no-files-found: ignore
